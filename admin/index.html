<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harinamadwar Admin</title>

<style>
:root { --page:#FAF6F0; --text:#1B2638; --muted:#4D5D76; --line:#D3DFF0; --soft:#E6EEF9; --bar:#1D4E9E; --deep:#163E7E;
  --acc:#CA7E0B; --label:#B06A00; --ok:#2E7D4F; --bad:#B3261E; --card:#fff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--page); color: var(--text); font: 17px/1.45 Mukta, -apple-system, "Segoe UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
.hidden { display: none !important; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bar); color: #fff; border-bottom: 3px solid var(--acc); padding: calc(10px + env(safe-area-inset-top)) 14px 10px; }
.top-row { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 40px; }
.top-row h1 { flex: 1; margin: 0; font-size: 20px; }
.back { font-size: 17px; font-weight: 700; padding: 6px 8px; margin-left: -8px; border-radius: 18px; }
.chip-admin { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,.16); }
main { max-width: 640px; margin: 0 auto; padding: 18px 18px calc(110px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: var(--label); margin-top: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stats div { padding: 10px 12px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
.stats b { display: block; font-size: 24px; font-weight: 800; color: var(--deep); line-height: 1.2; }
.stats span { font-size: 13px; color: var(--muted); }
.search { width: 100%; padding: 11px 16px; border-radius: 22px; border: 1px solid var(--line); background: #fff; outline: none; }
.list { overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--soft); width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
button.row:active { background: var(--soft); }
.av { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); color: var(--deep); font-weight: 800; display: grid; place-items: center; flex-shrink: 0; }
.av.big { width: 56px; height: 56px; font-size: 24px; }
.rt { flex: 1; min-width: 0; }
.rt b { display: block; font-size: 17px; color: var(--deep); line-height: 1.25; }
.rt span { display: block; font-size: 13px; color: var(--muted); }
.st { font-size: 13px; font-weight: 700; white-space: nowrap; }
.st.active { color: var(--ok); } .st.sent { color: var(--label); } .st.paused { color: var(--muted); } .st.none { color: var(--bad); }
.btn { min-height: 50px; border-radius: 25px; padding: 0 18px; font-weight: 700; font-size: 17px; width: 100%; }
.btn.acc { background: var(--acc); color: #1B1206; }
.btn.deep { background: var(--deep); color: #fff; }
.btn.line { background: #fff; border: 1.5px solid var(--line); color: var(--deep); }
.btn.bad { background: #fff; border: 1.5px solid #E8B8B3; color: var(--bad); }
.btn.wa { background: #1E7A46; color: #fff; }
.btn.small { min-height: 40px; width: auto; font-size: 14px; padding: 0 14px; border-radius: 20px; }
.btn:disabled { opacity: .45; }
.pair { display: flex; gap: 10px; } .pair > * { flex: 1; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 700; color: var(--deep); }
.f input, .f textarea, .f select { font-weight: 400; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; outline: none; width: 100%; }
.f input:focus, .f textarea:focus { border-color: var(--bar); }
.f textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
.hint { font-size: 14px; color: var(--muted); }
.err { color: var(--bad); font-size: 15px; font-weight: 600; }
.code-card { padding: 18px; border-radius: 18px; background: #FFF8EA; border: 1.5px solid #E8D3A6; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.code { font-size: 40px; font-weight: 800; letter-spacing: 4px; color: var(--deep); line-height: 1.1; user-select: all; }
.head { display: flex; align-items: center; gap: 14px; }
.head .rt b { font-size: 24px; }
.dev svg { width: 24px; height: 24px; flex-shrink: 0; color: var(--deep); }
details.pend summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
details.pend summary::-webkit-details-marker { display: none; }
details.pend .rt { flex: 1; }
.pn { min-width: 36px; padding: 2px 10px; border-radius: 14px; background: #FBE3DC; color: var(--bad); font-weight: 800; text-align: center; }
.pn.done { background: #E3F2E8; color: var(--ok); }
.pch { padding: 6px 14px 10px; border-top: 1px solid var(--soft); display: flex; flex-direction: column; gap: 4px; }
.pit { color: var(--text); text-decoration: none; font-size: 15px; }
.pit b { color: var(--deep); }
.foot-note { padding: 12px 14px; font-size: 14px; color: var(--muted); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 7px 14px; border-radius: 16px; font-size: 15px; font-weight: 700; background: var(--soft); color: var(--deep); }
.tab.on { background: var(--bar); color: #fff; }
.item { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; }
.item .t { display: flex; justify-content: space-between; gap: 10px; }
.item .t b { color: var(--deep); font-size: 17px; }
.item .t span { color: var(--bar); font-weight: 700; flex-shrink: 0; }
.item .s { font-size: 14px; color: var(--muted); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; border-top: 1px solid var(--line); padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); }
.nav div { max-width: 640px; margin: 0 auto; display: flex; gap: 6px; }
.nav button { flex: 1; min-height: 52px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--muted); }
.nav button svg { width: 24px; height: 24px; }
.nav button.on { background: var(--soft); color: var(--deep); font-weight: 700; }
.signin { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 30px 22px; }
.door { width: 110px; height: 140px; border-radius: 55px 55px 8px 8px; border: 3px solid #D4A853; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18px; }
.signin h2 { margin: 0; font-size: 28px; color: var(--deep); }
.signin .btn { max-width: 320px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; background: rgba(27,38,56,.94); color: #fff;
  padding: 11px 20px; border-radius: 22px; font-size: 16px; max-width: 90%; text-align: center; }
.demo { background: #FFF8EA; border: 1px dashed #E8D3A6; color: var(--label); border-radius: 12px; padding: 8px 12px; font-size: 14px; text-align: center; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--soft); }
.set-row:last-child { border-bottom: 0; }
.set-row input { width: 80px; text-align: center; padding: 8px; border-radius: 10px; border: 1px solid var(--line); font-size: 17px; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.ask { position: fixed; inset: 0; z-index: 30; background: rgba(14,30,62,.5); display: flex; align-items: flex-end; justify-content: center; }
.ask-box { width: 100%; max-width: 520px; background: var(--page); border-radius: 22px 22px 0 0; border-top: 4px solid var(--acc); padding: 22px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.ask-box p { margin: 0 0 4px; font-size: 18px; line-height: 1.45; color: var(--text); }
</style>
</head>

};

/** In-page "Are you sure?" (large buttons; the browser's own pop-up is blocked in some viewers). */
function ask(msg, yes, danger) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'ask';
    d.innerHTML = `<div class="ask-box" role="dialog"><p>${esc(msg)}</p><button class="btn ${danger ? 'bad' : 'deep'}" data-a="1">${esc(yes)}</button><button class="btn line" data-a="0">Cancel</button></div>`;
    d.onclick = e => { const b = e.target.closest('[data-a]'); if (b || e.target === d) { d.remove(); res(!!(b && b.dataset.a === '1')); } };
    document.body.appendChild(d);
  });
}
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2600); }
const fmtPhone = p => { const d = String(p || '').replace(/\D/g, '').slice(-10); return d.length === 10 ? '+91 ' + d.slice(0, 5) + ' ' + d.slice(5) : p; };
function ago(t) {
  if (!t) return 'never';
  const d = Math.floor((Date.now() - new Date(t)) / 864e5);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 60 ? d + ' days ago' : new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
const daysLeft = t => Math.max(0, Math.ceil((new Date(t) - Date.now()) / 864e5));
const ERR = { exists: 'This phone number is already in the list.', phone: 'Please enter a 10-digit phone number.',

// Demo: same screens with sample people, nothing is saved anywhere.
function demoApi() {
  const day = 864e5, now = Date.now(), uid = () => Math.random().toString(36).slice(2);
  const S = [
    { id: 'k', name: 'Kamala', phone: '9845000101', note: '', status: 'active', dev: [{ id: uid(), label: 'Android phone', platform: 'android', last_seen: now }, { id: uid(), label: 'iPad', platform: 'ios', last_seen: now - 2 * day }] },

  ];
  let E = [{ id: uid(), last_day: '2026-11-21', when_text: 'November 21st', month: 'NOV', days: '21', name: 'Ayyappan Bhajan', place: 'Mania’s house' },
    { id: uid(), last_day: '2026-11-29', when_text: 'Nov 28 and 29', month: 'NOV', days: '28–29', name: 'Radha Kalyanam', place: 'RP3 Bangalore' }];
  let T = [{ number: 253, series: 'Epic Series 123', title: 'Why Do We Suffer Twice?', song_ref: 'dns:8.4', body: 'Have you noticed how often we worry about things that haven’t even happened?\n\n…', published: true }];
  const set = { offline_days: 30, device_limit: 3, code_days: 7, meet_url: 'https://meet.google.com/kcv-uviq-vqe', practice_songs: '22.7,5.2,24.1' };
  let A = [{ email: 'you@gmail.com', name: 'You' }];
  const code = () => 'HN-' + Array.from({ length: 4 }, () => '23456789ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random() * 31)]).join('');
  const find = id => S.find(s => s.id === id);
  const wait = v => new Promise(r => setTimeout(() => r(v), 120));
  return {
    students: () => wait(S.map(s => ({ id: s.id, name: s.name, phone: s.phone, note: s.note, status: s.status, devices: s.dev.length,
      last_seen: s.dev.length ? Math.max(...s.dev.map(d => d.last_seen)) : null, code_expires: s.code || null }))
      .sort((a, b) => a.name.localeCompare(b.name))),
    devices: id => wait(find(id).dev.map(d => ({ ...d }))),
    addStudent(n, p, note) {
      const d = p.replace(/\D/g, '').slice(-10);
      if (d.length < 10) return wait({ ok: false, error: 'phone' });
      if (S.some(s => s.phone === d)) return wait({ ok: false, error: 'exists' });
      const s = { id: uid(), name: n, phone: d, note, status: 'active', dev: [] }; S.push(s);
      return this.newCode(s.id).then(r => ({ ...r, id: s.id }));
    },
    updateStudent(id, n, p, note) { Object.assign(find(id), { name: n, phone: p.replace(/\D/g, '').slice(-10), note }); return wait({ ok: true }); },
    newCode(id) { const s = find(id); if (s.dev.length >= set.device_limit) return wait({ ok: false, error: 'full' }); s.code = now + set.code_days * day; return wait({ ok: true, code: code(), expires_at: s.code, device_no: s.dev.length + 1, days: set.code_days }); },

    saveEvent(e) { if (e.id) Object.assign(E.find(x => x.id === e.id), e); else E.push({ ...e, id: uid() }); return wait(); },

    saveThought(t) { T = T.filter(x => x.number !== t.number); T.push(t); return wait(); },
    deleteThought(n) { T = T.filter(x => x.number !== n); return wait(); },
    settings: () => wait({ ...set }),
    setSetting(k, v) { set[k] = v; return wait(); },
    admins: () => wait(A.slice()),
    addAdmin(e, n) { A.push({ email: e.toLowerCase(), name: n }); return wait(); },
    removeAdmin(e) { if (e === 'you@gmail.com') return wait({ ok: false, error: 'self' }); A = A.filter(x => x.email !== e); return wait({ ok: true }); },
    dashboard: () => wait({ students: S.length, active: S.filter(s => s.status === 'active').length, paused: S.filter(s => s.status === 'paused').length,
      no_device: S.filter(s => !s.dev.length).length, codes_waiting: S.filter(s => s.code && !s.dev.length).length, devices: S.reduce((n, s) => n + s.dev.length, 0),
      seen_7_days: S.filter(s => s.dev.some(d => d.last_seen > now - 7 * day)).length, upcoming_events: E.length, thoughts: T.length, last_thought: 253, reactions_7_days: 9 }),
    reactions: () => wait([{ tfd: 253, emoji: '🙏', n: 6 }, { tfd: 253, emoji: '❤️', n: 3 }]),
  };
}

const APP_BASE = /\/admin\/?(index\.html)?$/.test(location.pathname) ? new URL('../', location.href).href : IPHONE_APP;
async function appFile(path) { try { const r = await fetch(APP_BASE + path, { cache: 'no-store' }); return r.ok ? await r.text() : ''; } catch (e) { return ''; } }
const heads = t => [...t.replace(/\r/g, '').matchAll(/^@@\s*([^|\n]+?)\s*\|\s*([^|\n]*)/gm)].map(m => ({ n: m[1], title: m[2].trim() }));
const nonEmpty = t => { const m = new Set(); t.replace(/\r/g, '').split(/\n(?=@@)/).forEach(b => { const h = b.match(/^@@\s*([^|\n]+?)\s*\|/); if (h && b.split('\n').slice(1).join('').trim()) m.add(h[1]); }); return m; };
const audioSet = t => new Set(t.replace(/\r/g, '').split('\n').filter(l => /^[^#\s][^|]*\|\s*\S/.test(l)).map(l => l.split('|')[0].trim()));
async function pending() {
  const [songs, ta, en, kn, au, aSongs, aAu] = await Promise.all(['songs.txt', 'meanings_ta.txt', 'meanings_en.txt', 'meanings_kn.txt', 'audio.txt', 'ashtapathy/songs.txt', 'ashtapathy/audio.txt'].map(appFile));
  if (!songs) return null;
  const list = heads(songs).filter(s => /\d/.test(s.n)), mt = nonEmpty(ta), me = nonEmpty(en), mk = nonEmpty(kn), a = audioSet(au);
  const al = heads(aSongs).filter(s => /\d/.test(s.n)), aa = audioSet(aAu);
  return { total: list.length, aTotal: al.length,
    meaning: list.filter(s => !mt.has(s.n)), meaningEn: list.filter(s => mt.has(s.n) && !me.has(s.n)), meaningKn: list.filter(s => mt.has(s.n) && !mk.has(s.n)),
    audio: list.filter(s => !a.has(s.n)), aAudio: al.filter(s => !aa.has(s.n)) };
}
function missingBlock(title, sub, items, hash) {
  if (!items) return '';
  const byChap = {}; items.forEach(s => { const c = s.n.split('.')[0]; (byChap[c] = byChap[c] || []).push(s); });
  return `<details class="card pend"><summary><span class="rt"><b>${esc(title)}</b><span>${esc(sub)}</span></span><span class="pn ${items.length ? '' : 'done'}">${items.length || '✓'}</span></summary>` +

      l.map(s => `<a class="pit" target="_blank" rel="noopener" href="${esc(IPHONE_APP + hash + s.n)}"><b>${esc(s.n)}</b> ${esc(s.title)}</a>`).join('') + '</div>').join('') : '<div class="foot-note">Nothing missing.</div>') + '</details>';
}

  ticket();
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

    auto();
    const a = new Date(d1.value + 'T12:00'), b = new Date(d2.value + 'T12:00');
    await guard(() => api.saveEvent({ id: e && e.id, first_day: d1.value, last_day: d2.value, when_text: wt.value.trim(), month: MON[a.getMonth()],
      days: +a === +b ? String(a.getDate()) : a.getDate() + '–' + b.getDate(), name: nm, place: pl }));
    toast('Saved'); showContent();
  };
  if (e) document.getElementById('dl').onclick = async () => { if (await ask('Delete this satsang?', 'Delete', true)) { await guard(() => api.deleteEvent(e.id)); toast('Deleted'); showContent(); } };
}

function showThought(t, next) {
  ticket();
  page(t ? 'Edit thought' : 'New thought', `
    <div class="pair"><label class="f">TFD number<input id="no" type="number" inputmode="numeric" value="${t ? t.number : next}" ${t ? 'disabled' : ''}></label><label class="f">Series (optional)<input id="se" value="${esc(t ? t.series : '')}"></label></div>
    <label class="f">Title<input id="ti" value="${esc(t ? t.title : '')}"></label>
    <label class="f">The thought<textarea id="bo" placeholder="Paste the whole message here. Leave an empty line between paragraphs.">${esc(t ? t.body : '')}</textarea></label>
    <label class="f">Related bhajan (optional)<input id="sg" value="${esc(t ? t.song_ref.replace(/^dns:/, '') : '')}" placeholder="Song number, e.g. 8.4"></label>
    <label style="display:flex;gap:10px;align-items:center;font-size:16px"><input id="pb" type="checkbox" style="width:22px;height:22px" ${!t || t.published ? 'checked' : ''}> Show in the app</label>
    <div class="err" id="er"></div>
    <button class="btn deep" id="sv">Publish</button>${t ? '<button class="btn bad" id="dl">Delete</button>' : ''}`, { back: showContent });
  document.getElementById('sv').onclick = async () => {
    const no = +document.getElementById('no').value, ti = document.getElementById('ti').value.trim(), bo = document.getElementById('bo').value.replace(/\r/g, '').trim();
    if (!no || !ti || !bo) return (document.getElementById('er').textContent = 'Please fill in the number, title and the thought.');
    const sg = document.getElementById('sg').value.trim();
    await guard(() => api.saveThought({ number: no, series: document.getElementById('se').value.trim(), title: ti, body: bo,
      song_ref: sg ? (sg.includes(':') ? sg : 'dns:' + sg) : '', published: document.getElementById('pb').checked }));
    toast('Published'); showContent();
  };
  if (t) document.getElementById('dl').onclick = async () => { if (await ask('Delete TFD ' + t.number + '?', 'Delete', true)) { await guard(() => api.deleteThought(t.number)); toast('Deleted'); showContent(); } };
}

// ---------------------------------------------------------------- settings
async function showSettings() {
  const live = ticket();
  page('Settings', '<div class="empty">Loading…</div>');
  const [s, ad] = await Promise.all([guard(() => api.settings()), guard(() => api.admins())]); if (!s || !ad || !live()) return;
  page('Settings', `<div class="lbl">ACCESS RULES</div><div class="card">
    <div class="set-row"><span class="rt"><b>Days the app works offline</b><span>Then it needs internet once to check access</span></span><input id="od" type="number" min="1" max="365" value="${s.offline_days}"></div>
    <div class="set-row"><span class="rt"><b>Devices per student</b><span>Phones and iPads</span></span><input id="dl" type="number" min="1" max="10" value="${s.device_limit}"></div>
    <div class="set-row"><span class="rt"><b>Days an invite code is valid</b><span>Unused codes stop working after this</span></span><input id="cd" type="number" min="1" max="60" value="${s.code_days}"></div></div>
    <button class="btn deep" id="sv">Save rules</button>
    <div class="lbl">ADMINS · ALL HAVE THE SAME RIGHTS</div>
    <div class="card list">${ad.map(a => `<div class="row"><span class="av">${esc((a.name || a.email)[0]).toUpperCase()}</span><span class="rt"><b>${esc(a.name || a.email)}</b><span>${esc(a.email)}</span></span>
      <button class="btn bad small" data-ad="${esc(a.email)}">Remove</button></div>`).join('')}</div>
    <div class="pair"><input class="search" id="ae" type="email" placeholder="Google e-mail"><input class="search" id="an" placeholder="Name"></div>
    <button class="btn line" id="aa">+ Add admin</button>
    <a class="btn line" href="${esc(APP_BASE)}" style="text-align:center;text-decoration:none">‹ Back to the Harinamadwar app</a>
    ${DEMO ? '' : '<button class="btn line" id="so">Sign out</button>'}`);
  document.getElementById('sv').onclick = async () => {
    const v = id => Math.max(1, parseInt(document.getElementById(id).value, 10) || 1);
    await guard(async () => { await api.setSetting('offline_days', v('od')); await api.setSetting('device_limit', v('dl')); await api.setSetting('code_days', v('cd')); });
    toast('Saved');
  };
  document.getElementById('aa').onclick = async () => {
    const e = document.getElementById('ae').value.trim(); if (!/^\S+@\S+\.\S+$/.test(e)) return toast('Please type their e-mail address.');
    await guard(() => api.addAdmin(e, document.getElementById('an').value.trim())); toast('Admin added'); showSettings();
  };
  on('[data-ad]', 'click', async ev => {
    const e = ev.currentTarget.dataset.ad; if (!(await ask('Remove ' + e + ' as admin?', 'Remove admin', true))) return;
    const r = await guard(() => api.removeAdmin(e)); if (r && !r.ok) return toast(ERR[r.error]); toast('Removed'); showSettings();
  });
  if (!DEMO) document.getElementById('so').onclick = async () => { await sb.auth.signOut(); showSignIn(); };
}

// ---------------------------------------------------------------- start
(async function start() {
  if (DEMO) return go();
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const check = async session => {
    if (!session) return showSignIn();
    me = session.user.email;
    const { data, error } = await sb.rpc('is_admin');
    if (error || !data) { await sb.auth.signOut(); return showSignIn(me + ' is not on the admin list. Please ask another admin to add you.'); }
    go();
  };
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') check(session); });
  const { data } = await sb.auth.getSession();
  check(data.session);
})();
</script>

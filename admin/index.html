<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harinamadwar Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D4E9E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Mukta+Malar:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --page:#FAF6F0; --text:#1B2638; --muted:#4D5D76; --line:#D3DFF0; --soft:#E6EEF9; --bar:#1D4E9E; --deep:#163E7E;
  --acc:#CA7E0B; --label:#B06A00; --ok:#2E7D4F; --bad:#B3261E; --card:#fff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--page); color: var(--text); font: 17px/1.45 Mukta, -apple-system, "Segoe UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
.hidden { display: none !important; }
.top { position: sticky; top: 0; z-index: 5; background: var(--bar); color: #fff; border-bottom: 3px solid var(--acc); padding: calc(10px + env(safe-area-inset-top)) 14px 10px; }
.top-row { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 40px; }
.top-row h1 { flex: 1; margin: 0; font-size: 20px; }
.back { font-size: 17px; font-weight: 700; padding: 6px 8px; margin-left: -8px; border-radius: 18px; }
.chip-admin { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,.16); }
main { max-width: 640px; margin: 0 auto; padding: 18px 18px calc(110px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: var(--label); margin-top: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stats div { padding: 10px 12px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
.stats b { display: block; font-size: 24px; font-weight: 800; color: var(--deep); line-height: 1.2; }
.stats span { font-size: 13px; color: var(--muted); }
.search { width: 100%; padding: 11px 16px; border-radius: 22px; border: 1px solid var(--line); background: #fff; outline: none; }
.list { overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--soft); width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
button.row:active { background: var(--soft); }
.av { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); color: var(--deep); font-weight: 800; display: grid; place-items: center; flex-shrink: 0; }
.av.big { width: 56px; height: 56px; font-size: 24px; }
.rt { flex: 1; min-width: 0; }
.rt b { display: block; font-size: 17px; color: var(--deep); line-height: 1.25; }
.rt span { display: block; font-size: 13px; color: var(--muted); }
.st { font-size: 13px; font-weight: 700; white-space: nowrap; }
.st.active { color: var(--ok); } .st.sent { color: var(--label); } .st.paused { color: var(--muted); } .st.none { color: var(--bad); }
.btn { min-height: 50px; border-radius: 25px; padding: 0 18px; font-weight: 700; font-size: 17px; width: 100%; }
.btn.acc { background: var(--acc); color: #1B1206; }
.btn.deep { background: var(--deep); color: #fff; }
.btn.line { background: #fff; border: 1.5px solid var(--line); color: var(--deep); }
.btn.bad { background: #fff; border: 1.5px solid #E8B8B3; color: var(--bad); }
.btn.wa { background: #1E7A46; color: #fff; }
.btn.small { min-height: 40px; width: auto; font-size: 14px; padding: 0 14px; border-radius: 20px; }
.btn:disabled { opacity: .45; }
.pair { display: flex; gap: 10px; } .pair > * { flex: 1; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 700; color: var(--deep); }
.f input, .f textarea, .f select { font-weight: 400; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; outline: none; width: 100%; }
.f input:focus, .f textarea:focus { border-color: var(--bar); }
.f textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
.hint { font-size: 14px; color: var(--muted); }
.err { color: var(--bad); font-size: 15px; font-weight: 600; }
.code-card { padding: 18px; border-radius: 18px; background: #FFF8EA; border: 1.5px solid #E8D3A6; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.code { font-size: 40px; font-weight: 800; letter-spacing: 4px; color: var(--deep); line-height: 1.1; user-select: all; }
.head { display: flex; align-items: center; gap: 14px; }
.head .rt b { font-size: 24px; }
.dev svg { width: 24px; height: 24px; flex-shrink: 0; color: var(--deep); }
details.pend summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
details.pend summary::-webkit-details-marker { display: none; }
details.pend .rt { flex: 1; }
.pn { min-width: 36px; padding: 2px 10px; border-radius: 14px; background: #FBE3DC; color: var(--bad); font-weight: 800; text-align: center; }
.pn.done { background: #E3F2E8; color: var(--ok); }
.pch { padding: 6px 14px 10px; border-top: 1px solid var(--soft); display: flex; flex-direction: column; gap: 4px; }
.pit { color: var(--text); text-decoration: none; font-size: 15px; }
.pit b { color: var(--deep); }
.foot-note { padding: 12px 14px; font-size: 14px; color: var(--muted); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 7px 14px; border-radius: 16px; font-size: 15px; font-weight: 700; background: var(--soft); color: var(--deep); }
.tab.on { background: var(--bar); color: #fff; }
.item { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; }
.item .t { display: flex; justify-content: space-between; gap: 10px; }
.item .t b { color: var(--deep); font-size: 17px; }
.item .t span { color: var(--bar); font-weight: 700; flex-shrink: 0; }
.item .s { font-size: 14px; color: var(--muted); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; border-top: 1px solid var(--line); padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); }
.nav div { max-width: 640px; margin: 0 auto; display: flex; gap: 6px; }
.nav button { flex: 1; min-height: 52px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--muted); }
.nav button svg { width: 24px; height: 24px; }
.nav button.on { background: var(--soft); color: var(--deep); font-weight: 700; }
.signin { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 30px 22px; }
.door { width: 110px; height: 140px; border-radius: 55px 55px 8px 8px; border: 3px solid #D4A853; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18px; }
.signin h2 { margin: 0; font-size: 28px; color: var(--deep); }
.signin .btn { max-width: 320px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; background: rgba(27,38,56,.94); color: #fff;
  padding: 11px 20px; border-radius: 22px; font-size: 16px; max-width: 90%; text-align: center; }
.demo { background: #FFF8EA; border: 1px dashed #E8D3A6; color: var(--label); border-radius: 12px; padding: 8px 12px; font-size: 14px; text-align: center; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--soft); }
.set-row:last-child { border-bottom: 0; }
.set-row input { width: 80px; text-align: center; padding: 8px; border-radius: 10px; border: 1px solid var(--line); font-size: 17px; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.ask { position: fixed; inset: 0; z-index: 30; background: rgba(14,30,62,.5); display: flex; align-items: flex-end; justify-content: center; }
.ask-box { width: 100%; max-width: 520px; background: var(--page); border-radius: 22px 22px 0 0; border-top: 4px solid var(--acc); padding: 22px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.ask-box p { margin: 0 0 4px; font-size: 18px; line-height: 1.45; color: var(--text); }

/* recordings */
.sw { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--deep); font-weight: 600; }
.sw input { width: 20px; height: 20px; accent-color: var(--bar); }
details.rec-g { border-top: 1px solid var(--soft); }
details.rec-g summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 18px; cursor: pointer; background: #FBFCFE; }
details.rec-g summary::-webkit-details-marker { display: none; }
details.rec-g summary .rt b { font-size: 15.5px; }
details.rec-g details.rec-g summary { padding-left: 28px; background: #fff; }
details.rec-g .pn { font-size: 13px; min-width: 30px; }
.rec-row { padding: 10px 14px 12px 22px; border-top: 1px solid var(--soft); display: flex; flex-direction: column; gap: 8px; }
.rec-row.done .rec-t { color: var(--muted); }
.rec-t { font-size: 15.5px; } .rec-t b { color: var(--deep); margin-right: 4px; }
.rtag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px; margin-left: 4px; vertical-align: 1px; }
.rtag.up { background: #FFF1D6; color: var(--label); } .rtag.ok { background: #E3F2E8; color: var(--ok); } .rtag.no { background: #FDECEA; color: #B3261E; }
.rec-row audio { width: 100%; height: 36px; }
.rec-act { display: flex; gap: 8px; }
.ra { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border-radius: 20px; border: 1.5px solid var(--line); background: #fff; color: var(--deep); font-size: 14px; font-weight: 700; }
.ra svg { width: 18px; height: 18px; }
.ra.rec { color: var(--bad); border-color: #F0C9C4; } .ra.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.ra:disabled { opacity: .4; }
.rec-sheet { align-items: center; text-align: center; }
.rec-time { font-size: 44px; font-weight: 800; color: var(--deep); font-variant-numeric: tabular-nums; }
.rec-big { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #F0C9C4; display: grid; place-items: center; background: #fff; }
.rec-big span { width: 54px; height: 54px; border-radius: 50%; background: var(--bad); transition: all .2s; }
.rec-big.on span { width: 30px; height: 30px; border-radius: 6px; }
.rec-sheet.lyr { height: 94vh; height: 94dvh; text-align: left; align-items: stretch; gap: 10px; padding-top: 14px; }
.ly-top { display: flex; align-items: center; gap: 10px; }
.ly-h { flex: 1; min-width: 0; font-size: 18px; color: var(--deep); line-height: 1.3; }
.ly-h span { color: var(--text); }
.ly-x { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; display: grid; place-items: center; color: var(--muted); }
.ly-x svg { width: 18px; height: 18px; }
.ly-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ly-size { display: flex; gap: 6px; }
.ly-text { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; white-space: pre-wrap; line-height: 1.6; color: var(--text); font-family: 'Mukta', 'Mukta Malar', system-ui, sans-serif; }
.lyr.live .ly-text { border-color: #F0C9C4; box-shadow: 0 0 0 3px #FDECEA; }
.ly-bar { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.lyr .rec-time { font-size: 30px; }
.lyr .rec-big { width: 72px; height: 72px; } .lyr .rec-big span { width: 46px; height: 46px; } .lyr .rec-big.on span { width: 26px; height: 26px; }
.lyr audio { width: 100%; }
/* learn: chosen songs */
.q-list { overflow: hidden; }
.q-row { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 4px; border-bottom: 1px solid var(--soft); background: #fff; transition: transform .15s; position: relative; }
.q-row:last-child { border-bottom: 0; }
.q-row.lift { transition: none; z-index: 3; box-shadow: 0 8px 24px rgba(22,62,126,.22); border-radius: 12px; }
.q-grip { width: 40px; height: 44px; display: grid; place-items: center; color: var(--muted); cursor: grab; touch-action: none; flex-shrink: 0; }
.q-grip svg { width: 22px; height: 22px; }
.q-pos { width: 30px; height: 30px; border-radius: 50%; background: var(--chip, #E6EEF9); color: var(--deep); font-weight: 700; display: grid; place-items: center; flex-shrink: 0; font-size: 14px; }
.q-no { flex-shrink: 0; min-width: 46px; padding: 4px 6px; border-radius: 9px; text-align: center; background: var(--soft); color: var(--deep); font-weight: 800; font-size: 14px; }
.q-row .rt b { font-size: 16px; } .q-row .rt span { font-size: 12.5px; }
.q-btn { width: 30px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--deep); flex-shrink: 0; }
.q-btn svg { width: 20px; height: 20px; } .q-btn:disabled { opacity: .25; } .q-btn.x { color: var(--bad); }
.add-box { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pk-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pk-bar .pk-n { margin-left: auto; font-size: 14px; color: var(--muted); font-weight: 700; }
.pk-list { max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; overscroll-behavior: contain; }
.pk-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--soft); cursor: pointer; min-height: 52px; }
.pk-row:last-child { border-bottom: 0; }
.pk-row input { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--deep); }
.pk-row .pk-no { flex-shrink: 0; min-width: 44px; font-weight: 800; color: var(--deep); font-size: 14px; }
.pk-row .pk-t { flex: 1; font-size: 16px; line-height: 1.3; }
.pk-row.has { cursor: default; color: var(--muted); } .pk-row.has .pk-no { color: var(--muted); }
.pk-tag { font-size: 12px; font-weight: 700; color: var(--ok); background: #E3F2E8; border-radius: 10px; padding: 2px 8px; flex-shrink: 0; }
.pk-ch { background: var(--soft); position: sticky; top: 0; z-index: 1; font-weight: 800; color: var(--deep); }
.pk-ch .pk-t { font-size: 15px; } .pk-ch .pk-c { font-size: 13px; font-weight: 700; color: var(--muted); flex-shrink: 0; }

.lang-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lang-row .hint { margin-right: 4px; }
.lchip { padding: 5px 12px; border-radius: 14px; font-size: 14px; font-weight: 700; background: #fff; border: 1.5px solid var(--line); color: var(--deep); }
.lchip.on { background: var(--deep); border-color: var(--deep); color: #fff; }
.ra.lis { color: var(--ok); border-color: #BFE0CB; } .ra.lis.on { background: #E3F2E8; }
.rec-act { flex-wrap: wrap; } .ra { min-width: 92px; }
/* SCRUM-97: other songs (not in the app) */
.oc { border: 1.5px solid #E8C98A; background: #FFFBF2; }
.f textarea.oa { min-height: 84px; }
.f textarea.ly { min-height: 220px; white-space: pre-wrap; }
.otag { display: inline-block !important; font-size: 11.5px !important; font-weight: 700; color: var(--label) !important; background: #FFF1D6; border-radius: 9px; padding: 1px 8px; margin: 2px 6px 2px 0; }
.oc-tip { background: #fff; border: 1px dashed #E8C98A; border-radius: 10px; padding: 8px 10px; }
</style>

    d.innerHTML = `<div class="ask-box" role="dialog"><p>${esc(msg)}</p><button class="btn ${danger ? 'bad' : 'deep'}" data-a="1">${esc(yes)}</button><button class="btn line" data-a="0">Cancel</button></div>`;
    d.onclick = e => { const b = e.target.closest('[data-a]'); if (b || e.target === d) { d.remove(); res(!!(b && b.dataset.a === '1')); } };
    document.body.appendChild(d);
  });
}

}

const audioSet = t => new Set(t.replace(/\r/g, '').split('\n').filter(l => /^[^#\s][^|]*\|\s*\S/.test(l)).map(l => l.split('|')[0].trim()));

async function showStudent(id) {

    <div class="lbl">ACTIONS</div>

    <div class="hint">Pausing keeps the student’s devices but locks the songs until resumed. Removing deletes the student and all devices.</div>`, { back: go });

  };

// ---------------------------------------------------------------- the books: chapters, works, decades and song names, from the app's own files
const BOOKS = {
  dns: { name: 'Divya Nama Sankeertanam', short: 'Divya Nama', base: '', unit: 'Chapter', hash: '#song/' },
  ashta: { name: 'Śrī Gīta Govindam', short: 'Gita Govindam', base: 'ashtapathy/', unit: 'Aṣṭapadi', hash: '#ashta/' },
  ndp: { name: 'Naalaayira Divya Prabandham', short: 'Prabandham', base: 'prabandham/', unit: 'Work', hash: '#ndp/' },
};
// song names in the same language as the app (SCRUM-74): English, Tamil, Kannada or Sanskrit
const ADM_LANGS = [['en', 'English'], ['ta', 'தமிழ்'], ['kn', 'ಕನ್ನಡ'], ['sa', 'संस्कृतम्']];
let admLang = (() => { try { return localStorage.getItem('adm.lang') || 'en'; } catch (e) { return 'en'; } })();
const langPicker = only => `<div class="lang-row"><span class="hint">Song names in</span>${ADM_LANGS.filter(([c]) => !only || only.includes(c)).map(([c, n]) => `<button class="lchip ${c === (only && !only.includes(admLang) ? only[0] : admLang) ? 'on' : ''}" data-al="${c}">${n}</button>`).join('')}</div>`;
function wireLang(redraw) { on('[data-al]', 'click', e => { admLang = e.currentTarget.dataset.al; try { localStorage.setItem('adm.lang', admLang); } catch (x) {} redraw(); }); }
function bookTree(text, withDecades) {
  const out = []; let top = null, sub = null;
  for (const line of String(text || '').replace(/\r/g, '').split('\n')) {
    if (line.startsWith('## ')) { const [n, t] = line.slice(3).split('|').map(x => x.trim()); if (n === '0') { top = null; sub = null; continue; } top = { n, t, subs: [], songs: [] }; out.push(top); sub = null; }
    else if (line.startsWith('### ') && withDecades) { const [n, t] = line.slice(4).split('|').map(x => x.trim()); sub = { n, t, songs: [] }; if (top) top.subs.push(sub); }
    else if (line.startsWith('@@')) { const h = line.slice(2).split('|').map(x => x.trim()); if (!/\d/.test(h[0])) continue; const song = { n: h[0], title: h[4] || h[1] }; if (!top) { top = { n: '', t: '', subs: [], songs: [] }; out.push(top); } top.songs.push(song); if (sub) sub.songs.push(song); }
  }
  return out;
}
const treeCache = {};
/** the book's tree with names in the chosen language (falls back to English where a name is missing) */
async function loadTree(id, lang) {
  const key = id + '/' + lang;
  if (!treeCache[key]) treeCache[key] = (async () => {
    const b = BOOKS[id], tree = bookTree(await appFile(b.base + 'songs.txt'), id === 'ndp');
    if (lang === 'en') return tree;
    const lt = (await appFile(b.base + 'songs_' + lang + '.txt')).replace(/\r/g, '');
    const titles = new Map(), heads = new Map(), works = new Map();
    for (const line of lt.split('\n')) {
      if (line.startsWith('@@')) { const h = line.slice(2).split('|').map(x => x.trim()); if (h[1]) titles.set(h[0], h[1]); if (h[2]) works.set(h[0], h[2].replace(/\s+[\d-]+$/, '')); }
      else if (line.startsWith('## ')) { const [n, t] = line.slice(3).split('|').map(x => x.trim()); if (!heads.has(n)) heads.set(n, t); }
    }
    return tree.map(c => ({ ...c, t: (id === 'ndp' ? works.get(c.songs[0] && c.songs[0].n) : heads.get(c.n)) || c.t,
      subs: c.subs.map(d => ({ ...d, t: titles.get(d.songs[0] && d.songs[0].n) ? titles.get(d.songs[0].n).split(/\s+/).slice(0, 3).join(' ') : d.t, songs: d.songs.map(x => ({ ...x, title: titles.get(x.n) || x.title })) })),
      songs: c.songs.map(x => ({ ...x, title: titles.get(x.n) || x.title })) }));
  })();
  return treeCache[key];
}
// "22.7" = Divya Nama (as before); other books carry their name: "ashta:3", "ndp:86"
const refOf = (id, n) => id === 'dns' ? n : id + ':' + n;
const parseRef = r => { const i = r.indexOf(':'); return i > 0 && BOOKS[r.slice(0, i)] ? { id: r.slice(0, i), n: r.slice(i + 1) } : { id: 'dns', n: r }; };

// ---------------------------------------------------------------- the song picker (Satsangs and Learn): book → whole book / chapter / work / decade → tick many songs
// ps = { bk, chap, dec, sel, ly }: chap or dec '*' = everything; sel = ticked but not yet added (kept while moving between chapters and books)
const newPick = () => ({ bk: 'dns', chap: '*', dec: '*', sel: new Set(), ly: 0 });
function pickerGroups(trees, ps) {
  const tree = trees[ps.bk];
  if (ps.chap !== '*' && !tree.find(x => x.n === ps.chap)) ps.chap = '*';
  const c = ps.chap === '*' ? null : tree.find(x => x.n === ps.chap);
  if (c && c.subs.length && ps.dec !== '*' && !c.subs.find(x => x.n === ps.dec)) ps.dec = '*';
  const d = c && c.subs.length && ps.dec !== '*' ? c.subs.find(x => x.n === ps.dec) : null;
  const lab = x => (ps.bk === 'ashta' ? BOOKS.ashta.unit + ' ' + x.n + ' · ' : x.n + '. ') + x.t;
  const groups = ps.chap === '*' ? tree.map(x => ({ key: x.n, label: lab(x), songs: x.songs }))
    : d ? [{ key: '', label: '', songs: d.songs }]
    : c && c.subs.length ? c.subs.map(x => ({ key: x.n, label: x.n + ' · ' + x.t, songs: x.songs }))
    : [{ key: '', label: '', songs: c ? c.songs : [] }];
  return { tree, c, groups };
}
function pickerHtml(trees, ps, picked, title, addLabel) {
  const { tree, c, groups } = pickerGroups(trees, ps), bk = ps.bk, unit = BOOKS[bk].unit;
  const all = bk === 'ashta' ? 'aṣṭapadis' : bk === 'ndp' ? 'works' : 'chapters';
  const count = bk === 'ndp' ? tree.reduce((k, x) => k + x.songs.length, 0) + ' pāsurams' : 'whole book';
  const songRow = x => { const r = refOf(bk, x.n), has = picked.includes(r);
    return `<label class="pk-row ${has ? 'has' : ''}"><input type="checkbox" data-pk="${esc(r)}" ${has ? 'checked disabled' : ps.sel.has(r) ? 'checked' : ''}><span class="pk-no">${esc(x.n)}</span><span class="pk-t">${esc(x.title)}</span>${has ? '<span class="pk-tag">In list</span>' : ''}</label>`; };
  return `<div class="card add-box" data-add="${esc(addLabel)}"><div class="lbl" style="margin:0">${title}</div>
    <label class="f">Book<select id="bk">${Object.entries(BOOKS).map(([id, b]) => `<option value="${id}" ${id === bk ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></label>
    <label class="f">${unit}<select id="ch"><option value="*" ${ps.chap === '*' ? 'selected' : ''}>All ${all} (${count})</option>${tree.map(x => `<option value="${esc(x.n)}" ${x.n === ps.chap ? 'selected' : ''}>${esc(x.n)}. ${esc(x.t)}</option>`).join('')}</select></label>
    ${c && c.subs.length ? `<label class="f">Decade<select id="dc"><option value="*" ${ps.dec === '*' ? 'selected' : ''}>All decades (${c.songs.length} pāsurams)</option>${c.subs.map(x => `<option value="${esc(x.n)}" ${x.n === ps.dec ? 'selected' : ''}>${esc(x.n)} · ${esc(x.t)}</option>`).join('')}</select></label>` : ''}
    <div class="pk-bar"><button class="btn line small" id="pa">Select all</button><button class="btn line small" id="pn">Clear</button><span class="pk-n" id="pc"></span></div>
    <div class="pk-list" id="pk">${groups.map(g => g.label
      ? `<label class="pk-row pk-ch"><input type="checkbox" data-grp="${esc(g.key)}"><span class="pk-t">${esc(g.label)}</span><span class="pk-c">${g.songs.length}</span></label>${g.songs.map(songRow).join('')}`
      : g.songs.map(songRow).join('')).join('') || '<div class="empty">No songs here.</div>'}</div>
    <div class="hint">Tick a ${groups.some(g => g.label) ? 'heading to take all its songs' : 'song'}, or use Select all, then untick the ones you don’t want. Ticks are kept when you change the ${unit.toLowerCase()} or the book.</div>
    <button class="btn deep" id="ad"></button></div>`;
}
/** Ticking never redraws the page (no jump, no flicker). add(refs) gets the ticked songs in book order; redraw() is called after a book/chapter change. */
function wirePicker(trees, ps, picked, add, redraw) {
  const { groups } = pickerGroups(trees, ps), bk = ps.bk, pk = document.getElementById('pk');
  const label = document.querySelector('[data-add]').dataset.add;
  if (ps.ly) pk.scrollTop = ps.ly;
  pk.addEventListener('scroll', () => { ps.ly = pk.scrollTop; }, { passive: true });
  const shown = groups.flatMap(g => g.songs.map(x => refOf(bk, x.n)));
  const sync = () => {
    pk.querySelectorAll('[data-grp]').forEach(b => { const g = groups.find(x => x.key === b.dataset.grp), free = g.songs.map(x => refOf(bk, x.n)).filter(r => !picked.includes(r)), n = free.filter(r => ps.sel.has(r)).length;
      b.checked = free.length > 0 && n === free.length; b.indeterminate = n > 0 && n < free.length; b.disabled = !free.length; });
    const here = shown.filter(r => ps.sel.has(r)).length, all = ps.sel.size;
    document.getElementById('pc').textContent = all ? here + ' ticked here' + (all > here ? ' · ' + all + ' in all' : '') : '';
    const ad = document.getElementById('ad'); ad.disabled = !all; ad.textContent = all ? `+ Add ${all} song${all > 1 ? 's' : ''} ${label}` : '+ Add ' + label;
  };
  pk.addEventListener('change', ev => { const b = ev.target;
    if (b.dataset.pk) { b.checked ? ps.sel.add(b.dataset.pk) : ps.sel.delete(b.dataset.pk); }
    else if (b.dataset.grp !== undefined) { const g = groups.find(x => x.key === b.dataset.grp); g.songs.forEach(x => { const r = refOf(bk, x.n); if (picked.includes(r)) return; b.checked ? ps.sel.add(r) : ps.sel.delete(r); const el = pk.querySelector(`[data-pk="${CSS.escape(r)}"]`); if (el) el.checked = b.checked; }); }
    sync(); });
  document.getElementById('pa').onclick = () => { shown.forEach(r => { if (!picked.includes(r)) ps.sel.add(r); }); pk.querySelectorAll('[data-pk]:not(:disabled)').forEach(b => { b.checked = true; }); sync(); };
  document.getElementById('pn').onclick = () => { shown.forEach(r => ps.sel.delete(r)); pk.querySelectorAll('[data-pk]:not(:disabled)').forEach(b => { b.checked = false; }); sync(); };
  sync();
  const fresh = () => { ps.ly = 0; };
  document.getElementById('bk').onchange = ev => { ps.bk = ev.target.value; ps.chap = '*'; ps.dec = '*'; fresh(); redraw(); };
  document.getElementById('ch').onchange = ev => { ps.chap = ev.target.value; ps.dec = '*'; fresh(); redraw(); };
  const dc = document.getElementById('dc'); if (dc) dc.onchange = ev => { ps.dec = ev.target.value; fresh(); redraw(); };
  const ids = Object.keys(BOOKS);
  const order = r => { const { id, n } = parseRef(r); let k = 0; for (const c of trees[id]) for (const x of c.songs) { if (x.n === n) return ids.indexOf(id) * 1e6 + k; k++; } return 9e9; };
  document.getElementById('ad').onclick = () => { const refs = [...ps.sel].filter(r => !picked.includes(r)).sort((a, b) => order(a) - order(b));
    if (!refs.length) return; ps.sel = new Set(); add(refs); toast(refs.length + (refs.length > 1 ? ' songs' : ' song') + ' added to the list'); };
}
/** "3 ticked songs are not added yet – save anyway?" */
async function tickedNotAdded(ps) { const n = ps.sel.size; return !n || await ask(`${n} ticked song${n > 1 ? 's are' : ' is'} not added to the list yet. Save without ${n > 1 ? 'them' : 'it'}?`, 'Save anyway'); }

// ---------------------------------------------------------------- Learn: this week's songs from any book, chosen from drop-downs and put in order

      <div class="hint">Drag ☰ or use the arrows to change the order.</div>

    on('[data-dn]', 'click', e => { const i = +e.currentTarget.dataset.dn; [picked[i + 1], picked[i]] = [picked[i], picked[i + 1]]; dirty = true; draw(); });

function dragToReorder(list, done) {
  if (!list) return;
  list.querySelectorAll('.q-grip').forEach(g => g.addEventListener('pointerdown', e => {
    const row = g.closest('.q-row'), rows = [...list.querySelectorAll('.q-row')], from = rows.indexOf(row), h = row.offsetHeight, y0 = e.clientY;
    let to = from; row.classList.add('lift'); g.setPointerCapture(e.pointerId); e.preventDefault();
    const move = ev => {
      const dy = ev.clientY - y0; row.style.transform = `translateY(${dy}px)`;
      to = Math.max(0, Math.min(rows.length - 1, from + Math.round(dy / h)));
      rows.forEach((r, i) => { if (r === row) return; r.style.transform = (i > from && i <= to) ? `translateY(${-h}px)` : (i < from && i >= to) ? `translateY(${h}px)` : ''; });
    };
    const up = () => { g.removeEventListener('pointermove', move); rows.forEach(r => { r.style.transform = ''; r.classList.remove('lift'); }); if (to !== from) done(from, to); };
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', up, { once: true }); g.addEventListener('pointercancel', up, { once: true });
  }));
}

    <label class="f">Song name<input id="on" maxlength="80" value="${esc(of.title)}" placeholder="e.g. Vitthala Vitthala Panduranga"></label>
    <label class="f">About the song (one or two sentences)<textarea id="oa" class="oa" maxlength="200" placeholder="e.g. A Marathi abhang on Lord Vitthala.">${esc(of.about)}</textarea></label>
    <label class="f">Lyrics (paste here)<textarea id="ol" class="ly" maxlength="8000" placeholder="Paste the words here, in any language. Keep a blank line between verses.">${esc(of.lyrics)}</textarea></label>
    <div class="pk-bar"><span class="hint" id="oli"></span><span class="pk-n" id="oac"></span></div>
    <div class="hint oc-tip">When you add, extra spaces and runs of empty lines from the paste are tidied away; the verse breaks you keep stay. Songs you add are kept, so you can use them again at a later satsang.</div>
    <div class="err" id="oer">${esc(of.err)}</div>
    <div class="pair">${of.editing ? '<button class="btn line" id="ocx">Cancel</button>' : ''}<button class="btn deep" id="oad">${of.editing ? 'Save changes' : '+ Add to the list'}</button></div></div>`;
  const row = (r, i) => { const x = find(r);
    const mid = x.other
      ? `<span class="rt"><b>${esc(x.title)}</b><span><span class="otag">Other song · not in the app</span>${esc((x.about ? x.about + ' · ' : '') + (x.lyrics ? lyricLines(x.lyrics) + ' lines of lyrics' : 'No lyrics yet'))}</span></span>
         <button class="q-btn" data-ed="${i}" aria-label="Change this song">${ICON.pen}</button>`
      : `<span class="rt"><b>${esc(x.title)}</b><span>${esc(x.n + ' · ' + x.book + ' · ' + x.chap)}</span></span>`;
    return `<div class="q-row" data-i="${i}"${of.editing && picked[i] === 'other:' + of.id ? ' style="background:#FFF6E2"' : ''}>
        <span class="q-grip" title="Drag to move" aria-label="Drag to move">${ICON.grip}</span>
        <span class="q-pos">${i + 1}</span>${mid}
        <button class="q-btn" data-up="${i}" aria-label="Move up" ${i ? '' : 'disabled'}>${ICON.up}</button><button class="q-btn" data-dn="${i}" aria-label="Move down" ${i < picked.length - 1 ? '' : 'disabled'}>${ICON.down}</button>
        <button class="q-btn x" data-rm="${i}" aria-label="Remove">${ICON.x}</button></div>`; };
  const draw = () => {
    const y = first ? (keepState ? keepState.y : 0) : scrollY; first = false;
    page(e ? 'Edit satsang' : 'Add satsang', `
    <label class="f">Name of the satsang<input id="nm" value="${esc(f.nm)}" placeholder="Radha Kalyanam"></label>
    <label class="f">Place<input id="pl" value="${esc(f.pl)}" placeholder="RP3 Bangalore"></label>
    <div class="pair"><label class="f">First day<input id="d1" type="date" value="${esc(f.d1)}"></label><label class="f">Last day<input id="d2" type="date" value="${esc(f.d2)}"></label></div>
    <label class="f">How the date reads in the app<input id="wt" value="${esc(f.wt)}" placeholder="Nov 28 and 29"></label>
    <div class="hint">The satsang disappears from the app after its last day.</div>
    <label class="f">YouTube live link (optional)<input id="yt" type="url" inputmode="url" value="${esc(f.yt)}" placeholder="https://youtube.com/live/…"></label>
    <div class="hint">Paste the link of the live stream. Devotees get a “Watch live on YouTube” button, which opens the YouTube app, and a Share button.</div>
    ${langPicker(['en', 'ta'])}
    ${pickerHtml(trees, ps, picked, '1 · CHOOSE SONGS FROM THE BOOKS', 'to the list')}
    ${otherCard()}
    <div class="lbl">2 · SONGS TO BE SUNG · ${picked.length}</div>
    <div class="card q-list" id="ql">${picked.length ? picked.map(row).join('')
      : '<div class="empty">No songs yet. Choose them above; they are added in book order and you can then move them.</div>'}</div>
    <div class="hint">Drag ☰ or use the arrows to change the order. Book songs and other songs sit in one list. Tap the pencil to change an other song or its lyrics. Devotees see this list under Upcoming Satsangs, in this order.</div>
    <div class="err" id="er"></div>
    <button class="btn deep" id="sv">Save</button>${e ? '<button class="btn bad" id="dl">Delete</button>' : ''}`, { back: showContent });
    if (y) scrollTo(0, y);
    wireLang(() => { keep(); showEvent(e, { f, picked, ps, of, y: scrollY }); });   // stays where it was, keeps unsaved changes and ticks
    wirePicker(trees, ps, picked, refs => { keep(); picked.push(...refs); draw(); }, () => { keep(); draw(); });
    // other songs: live counts while typing (no redraw)
    const oa = document.getElementById('oa'), ol = document.getElementById('ol');
    const counts = () => { document.getElementById('oac').textContent = 'About: ' + oa.value.length + ' / 200';
      const n = lyricLines(ol.value); document.getElementById('oli').textContent = n ? n + ' lines pasted' : 'No lyrics yet (you can add them later)'; };
    oa.oninput = counts; ol.oninput = counts; counts();
    document.getElementById('on').oninput = () => { document.getElementById('oer').textContent = ''; };
    const lib = document.getElementById('olib');
    if (lib) lib.onchange = () => { keep(); const o = oById.get(lib.value);
      of = o ? { id: o.id, lib: o.id, title: o.title, about: o.about || '', lyrics: o.lyrics || '', editing: false, err: '' } : blankOther(); draw(); };
    const ocx = document.getElementById('ocx'); if (ocx) ocx.onclick = () => { keep(); of = blankOther(); draw(); };
    document.getElementById('oad').onclick = async () => {
      keep();
      const title = of.title.trim();
      if (!title) { document.getElementById('oer').textContent = 'Please type the song name.'; document.getElementById('on').focus(); return; }
      const o = { id: of.id, title, about: of.about.trim().replace(/\s+/g, ' '), lyrics: tidyLyrics(of.lyrics) };
      const btn = document.getElementById('oad'); btn.disabled = true;
      const id = await guard(() => api.saveOtherSong(o)); btn.disabled = false;
      if (!id) return;
      const rec = { ...o, id };
      const k = others.findIndex(x => x.id === id); if (k >= 0) others[k] = rec; else { others.push(rec); others.sort((a, b) => a.title.localeCompare(b.title)); }
      oById.set(id, rec);
      const r = 'other:' + id, was = of.editing;
      if (!picked.includes(r)) picked.push(r);
      of = blankOther(); draw();
      toast(was ? 'Song changed' : picked.indexOf(r) === picked.length - 1 ? 'Added to the list' : 'Already in the list');
    };
    on('[data-ed]', 'click', ev => { keep(); const o = oById.get(picked[+ev.currentTarget.dataset.ed].slice(6)); if (!o) return;
      of = { id: o.id, lib: '', title: o.title, about: o.about || '', lyrics: o.lyrics || '', editing: true, err: '' }; draw();
      document.getElementById('oc').scrollIntoView({ block: 'start' }); scrollBy(0, -80); });
    const d1 = document.getElementById('d1'), d2 = document.getElementById('d2'), wt = document.getElementById('wt');
    const auto = () => {
      if (!d1.value) return; if (!d2.value || d2.value < d1.value) d2.value = d1.value;
      const a = new Date(d1.value + 'T12:00'), b = new Date(d2.value + 'T12:00'), M = a.toLocaleString('en-IN', { month: 'short' });
      if (!wt.dataset.typed) wt.value = +a === +b ? a.toLocaleString('en-IN', { month: 'long' }) + ' ' + a.getDate() : a.getMonth() === b.getMonth() ? `${M} ${a.getDate()} and ${b.getDate()}` : `${M} ${a.getDate()} – ${b.toLocaleString('en-IN', { month: 'short' })} ${b.getDate()}`;
    };
    d1.onchange = auto; d2.onchange = auto; wt.oninput = () => { wt.dataset.typed = 1; };
    on('[data-up]', 'click', ev => { keep(); const i = +ev.currentTarget.dataset.up; [picked[i - 1], picked[i]] = [picked[i], picked[i - 1]]; draw(); });
    on('[data-dn]', 'click', ev => { keep(); const i = +ev.currentTarget.dataset.dn; [picked[i + 1], picked[i]] = [picked[i], picked[i + 1]]; draw(); });
    on('[data-rm]', 'click', ev => { keep(); const r = picked.splice(+ev.currentTarget.dataset.rm, 1)[0]; if (of.editing && r === 'other:' + of.id) of = blankOther(); draw(); });
    dragToReorder(document.getElementById('ql'), (from, to) => { keep(); const [m] = picked.splice(from, 1); picked.splice(to, 0, m); draw(); });
    document.getElementById('sv').onclick = async () => {
      keep();
      const nm = document.getElementById('nm').value.trim(), pl = document.getElementById('pl').value.trim();
      if (!nm || !pl || !d1.value) return (document.getElementById('er').textContent = 'Please fill in the name, place and first day.');
      const yt = document.getElementById('yt').value.trim();
      if (yt && !/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\/\S+$/.test(yt)) return (document.getElementById('er').textContent = 'Please paste a YouTube link (https://youtube.com/… or https://youtu.be/…).');
      if (!(await tickedNotAdded(ps))) return;
      if (of.title.trim() && !of.editing && !picked.includes('other:' + of.id) && !(await ask('The other song “' + of.title.trim() + '” is not added to the list yet. Save without it?', 'Save anyway'))) return;
      auto();
      const a = new Date(d1.value + 'T12:00'), b = new Date(d2.value + 'T12:00');
      const ok = await guard(async () => { await api.saveEvent({ id: e && e.id, first_day: d1.value, last_day: d2.value, when_text: wt.value.trim(), month: MON[a.getMonth()],
        days: +a === +b ? String(a.getDate()) : a.getDate() + '–' + b.getDate(), name: nm, place: pl, songs: picked.join(','), live_url: yt }); return true; });
      if (ok) { toast('Saved'); showContent(); }
    };
    if (e && e.id) document.getElementById('dl').onclick = async () => { if (await ask('Delete this satsang?', 'Delete', true)) { await guard(() => api.deleteEvent(e.id)); toast('Deleted'); showContent(); } };
  };
  draw();
}

function showThought(t, next) {
  ticket();
  page(t ? 'Edit thought' : 'New thought', `
    <div class="pair"><label class="f">TFD number<input id="no" type="number" inputmode="numeric" value="${t ? t.number : next}" ${t ? 'disabled' : ''}></label><label class="f">Series (optional)<input id="se" value="${esc(t ? t.series : '')}"></label></div>
    <label class="f">Title<input id="ti" value="${esc(t ? t.title : '')}"></label>
    <label class="f">The thought<textarea id="bo" placeholder="Paste the whole message here. Leave an empty line between paragraphs.">${esc(t ? t.body : '')}</textarea></label>
    <label class="f">Related bhajan (optional)<input id="sg" value="${esc(t ? t.song_ref.replace(/^dns:/, '') : '')}" placeholder="Song number, e.g. 8.4"></label>
    <label style="display:flex;gap:10px;align-items:center;font-size:16px"><input id="pb" type="checkbox" style="width:22px;height:22px" ${!t || t.published ? 'checked' : ''}> Show in the app</label>
    <div class="err" id="er"></div>
    <button class="btn deep" id="sv">Publish</button>${t ? '<button class="btn bad" id="dl">Delete</button>' : ''}`, { back: showContent });
  document.getElementById('sv').onclick = async () => {
    const no = +document.getElementById('no').value, ti = document.getElementById('ti').value.trim(), bo = document.getElementById('bo').value.replace(/\r/g, '').trim();
    if (!no || !ti || !bo) return (document.getElementById('er').textContent = 'Please fill in the number, title and the thought.');
    const sg = document.getElementById('sg').value.trim();
    await guard(() => api.saveThought({ number: no, series: document.getElementById('se').value.trim(), title: ti, body: bo,
      song_ref: sg ? (sg.includes(':') ? sg : 'dns:' + sg) : '', published: document.getElementById('pb').checked }));
    toast('Published'); showContent();
  };
  if (t) document.getElementById('dl').onclick = async () => { if (await ask('Delete TFD ' + t.number + '?', 'Delete', true)) { await guard(() => api.deleteThought(t.number)); toast('Deleted'); showContent(); } };
}

// ---------------------------------------------------------------- settings
async function showSettings() {
  const live = ticket();
  page('Settings', '<div class="empty">Loading…</div>');
  const [s, ad] = await Promise.all([guard(() => api.settings()), guard(() => api.admins())]); if (!s || !ad || !live()) return;
  page('Settings', `<div class="lbl">ACCESS RULES</div><div class="card">
    <div class="set-row"><span class="rt"><b>Days the app works offline</b><span>Then it needs internet once to check access</span></span><input id="od" type="number" min="1" max="365" value="${s.offline_days}"></div>
    <div class="set-row"><span class="rt"><b>Devices per student</b><span>Phones and iPads</span></span><input id="dl" type="number" min="1" max="10" value="${s.device_limit}"></div>
    <div class="set-row"><span class="rt"><b>Days an invite code is valid</b><span>Unused codes stop working after this</span></span><input id="cd" type="number" min="1" max="60" value="${s.code_days}"></div></div>
    <button class="btn deep" id="sv">Save rules</button>
    <div class="lbl">ADMINS · ALL HAVE THE SAME RIGHTS</div>
    <div class="card list">${ad.map(a => `<div class="row"><span class="av">${esc((a.name || a.email)[0]).toUpperCase()}</span><span class="rt"><b>${esc(a.name || a.email)}</b><span>${esc(a.email)}</span></span>
      <button class="btn bad small" data-ad="${esc(a.email)}">Remove</button></div>`).join('')}</div>
    <div class="pair"><input class="search" id="ae" type="email" placeholder="Google e-mail"><input class="search" id="an" placeholder="Name"></div>
    <button class="btn line" id="aa">+ Add admin</button>
    <a class="btn line" href="${esc(APP_BASE)}" style="text-align:center;text-decoration:none">‹ Back to the Harinamadwar app</a>
    ${DEMO ? '' : '<button class="btn line" id="so">Sign out</button>'}`);
  document.getElementById('sv').onclick = async () => {
    const v = id => Math.max(1, parseInt(document.getElementById(id).value, 10) || 1);
    await guard(async () => { await api.setSetting('offline_days', v('od')); await api.setSetting('device_limit', v('dl')); await api.setSetting('code_days', v('cd')); });
    toast('Saved');
  };
  document.getElementById('aa').onclick = async () => {
    const e = document.getElementById('ae').value.trim(); if (!/^\S+@\S+\.\S+$/.test(e)) return toast('Please type their e-mail address.');
    await guard(() => api.addAdmin(e, document.getElementById('an').value.trim())); toast('Admin added'); showSettings();
  };
  on('[data-ad]', 'click', async ev => {
    const e = ev.currentTarget.dataset.ad; if (!(await ask('Remove ' + e + ' as admin?', 'Remove admin', true))) return;
    const r = await guard(() => api.removeAdmin(e)); if (r && !r.ok) return toast(ERR[r.error]); toast('Removed'); showSettings();
  });
  if (!DEMO) document.getElementById('so').onclick = async () => { await sb.auth.signOut(); showSignIn(); };
}

// ---------------------------------------------------------------- start
(async function start() {
  if (DEMO) return go();
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const check = async session => {
    if (!session) return showSignIn();
    me = session.user.email;
    const { data, error } = await sb.rpc('is_admin');
    if (error || !data) { await sb.auth.signOut(); return showSignIn(me + ' is not on the admin list. Please ask another admin to add you.'); }
    go();
  };
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') check(session); });
  const { data } = await sb.auth.getSession();
  check(data.session);
})();
</script>
